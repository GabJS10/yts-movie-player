<!doctype html>
<!--
  Stand-in for the backend's /trailer page (src-tauri/src/stream.rs), served by Vite in dev only
  (/src/mocks/trailer.html). Same contract (IPC v0.12.1): the YouTube embed with enablejsapi=1, and
  { source: "yts-trailer", event, code? } posted to the parent.
  Knobs for tests and e2e (no internet needed): ?fail=153 → posts that error; ?fake=1 → posts "ready" and
  "playing" without loading YouTube.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tráiler</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #c9c9c9;
        font:
          15px system-ui,
          sans-serif;
      }
      #player,
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #fake {
        display: grid;
        place-items: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const send = (event, code) => {
        const msg = { source: "yts-trailer", event, ...(code !== undefined ? { code } : {}) };
        for (const target of [window.parent, window.opener])
          if (target && target !== window) target.postMessage(msg, "*");
      };
      if (params.get("fail")) {
        setTimeout(() => send("error", Number(params.get("fail"))), 200);
      } else if (params.get("fake")) {
        document.getElementById("player").outerHTML =
          '<div id="fake">Tráiler simulado: ' + (params.get("code") || "") + "</div>";
        setTimeout(() => send("ready"), 200);
        setTimeout(() => send("playing"), 400);
      } else {
        window.onYouTubeIframeAPIReady = () => {
          new YT.Player("player", {
            host: "https://www.youtube-nocookie.com",
            videoId: params.get("code"),
            playerVars: { autoplay: 1, rel: 0, playsinline: 1, origin: location.origin },
            events: {
              onReady: () => send("ready"),
              onStateChange: (e) => {
                if (e.data === 1) send("playing");
                if (e.data === 0) send("ended");
              },
              onError: (e) => send("error", e.data),
            },
          });
        };
        const s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        s.onerror = () => send("error", -1);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
