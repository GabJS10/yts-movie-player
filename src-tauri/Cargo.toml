[package]
name = "yts-player"
version = "0.1.0"
description = "Netflix-style desktop player for the YTS catalog"
authors = ["GabJS10"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yts_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
dirs = "7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "fs", "sync", "process", "io-util"] }
axum = "0.8.9"
moka = { version = "0.12.16", features = ["future"] }
tower-http = { version = "0.7.1", features = ["cors"] }
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
bytes = "1.12.1"
futures-util = "0.3.34"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio-util = { version = "0.7.19", features = ["io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2.190"
tauri-plugin-dialog = "2"


# Smaller debug builds (target/ was 37 GB): line tables only for our crate (backtraces
# keep file:line), no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"
