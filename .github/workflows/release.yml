name: Release

# Push a tag vX.Y.Z (after scripts/bump-version.sh X.Y.Z) to build the Linux packages and
# the Windows installer, put them in a DRAFT GitHub release and smoke-test the installed app.
# The draft is published by hand once the smoke tests pass and the packages were tried.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build packages (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    outputs:
      releaseId: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version matches the tag
        run: scripts/bump-version.sh --check "$TAG"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf rpm file gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      # Keep build-machine paths out of the binary (panic locations, tracing metadata).
      - name: Remap source paths
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo/registry/src=/cargo/registry --remap-path-prefix=$HOME/.cargo/git=/cargo/git --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "YTS Player ${{ env.TAG }}"
          releaseBody: "Ver CHANGELOG.md. Windows 10/11: instalador .exe. Linux: .deb (Debian/Ubuntu/Mint), .rpm (Fedora/openSUSE) y AppImage (cualquier distro)."
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --bundles deb,rpm,appimage
      # Test tools for the smoke jobs, built here so the clean containers stay clean.
      - name: Build the E2E seeder and tauri-driver
        working-directory: src-tauri
        run: |
          cargo build --example e2e_seeder
          cargo install tauri-driver --locked --root "$RUNNER_TEMP/tools"
          mkdir -p "$RUNNER_TEMP/smoke"
          cp target/debug/examples/e2e_seeder "$RUNNER_TEMP/tools/bin/tauri-driver" "$RUNNER_TEMP/smoke/"
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/smoke/"
      - name: No build-machine paths in the release binary
        run: |
          n=$(strings src-tauri/target/release/yts-player | grep -c "$HOME/" || true)
          echo "paths with $HOME: $n"
          test "$n" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: ${{ runner.temp }}/smoke
          retention-days: 7

  smoke-deb:
    name: Smoke test .deb (clean Ubuntu 24.04)
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke
          path: /smoke
      - name: Install the .deb on a clean system (dependencies must resolve)
        run: |
          apt-get update
          apt-get install -y /smoke/*.deb
          test -x /usr/bin/yts-player
          if ldd /usr/bin/yts-player | grep "not found"; then exit 1; fi
          ls /usr/share/applications/ | grep -i "yts" | grep "\.desktop$"
      - name: Install test tooling
        run: |
          apt-get install -y git ca-certificates curl xvfb xauth webkit2gtk-driver ffmpeg dbus-x11
          chmod +x /smoke/e2e_seeder /smoke/tauri-driver
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: e2e
      - name: E2E on the installed app (offline)
        working-directory: e2e
        env:
          E2E_APP_BINARY: /usr/bin/yts-player
          E2E_SEEDER_BINARY: /smoke/e2e_seeder
          TAURI_DRIVER_BINARY: /smoke/tauri-driver
        run: xvfb-run -a npm run app

  smoke-appimage:
    name: Smoke test AppImage
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke
          path: smoke
      - name: Start the AppImage and check it serves
        run: |
          # AppImages leave out graphics-driver libraries (EGL/GL) on purpose: every desktop
          # has them, a headless runner does not.
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgles2 libgl1 libgl1-mesa-dri
          chmod +x smoke/*.AppImage
          cd smoke && ./*.AppImage --appimage-extract >/dev/null && cd ..
          export XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_STATE_HOME="$RUNNER_TEMP/state"
          xvfb-run -a smoke/squashfs-root/AppRun > app.log 2>&1 &
          # Release builds log to $XDG_STATE_HOME/yts-player/logs; check both places.
          show_logs() { echo "--- app.log"; tail -60 app.log; echo "--- state logs"; tail -40 "$XDG_STATE_HOME"/yts-player/logs/* 2>/dev/null || true; }
          if ! timeout 90 bash -c 'until grep -rqs "local HTTP server listening" app.log "$XDG_STATE_HOME"; do sleep 1; done'; then
            echo "the app did not start serving in 90 s"; show_logs; exit 1
          fi
          sleep 10
          pgrep -f squashfs-root/ >/dev/null || { echo "the app exited"; show_logs; exit 1; }
          show_logs

  build-windows:
    name: Build installer (Windows)
    # After the Linux build, which creates the draft: this job adds the .exe to it.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - name: Remap source paths
        run: |
          w() { cygpath -w "$1"; }
          echo "RUSTFLAGS=--remap-path-prefix=$(w "$USERPROFILE/.cargo/registry/src")=/cargo/registry --remap-path-prefix=$(w "$USERPROFILE/.cargo/git")=/cargo/git --remap-path-prefix=$(w "$USERPROFILE/.rustup")=/rustup --remap-path-prefix=$(w "$GITHUB_WORKSPACE")=/build" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.build.outputs.releaseId }}
          args: --bundles nsis
      - name: Build the E2E seeder and tauri-driver
        working-directory: src-tauri
        run: |
          cargo build --example e2e_seeder
          cargo install tauri-driver --locked --root "$RUNNER_TEMP/tools"
          mkdir -p "$RUNNER_TEMP/smoke"
          cp target/debug/examples/e2e_seeder.exe "$RUNNER_TEMP/tools/bin/tauri-driver.exe" "$RUNNER_TEMP/smoke/"
          cp target/release/bundle/nsis/*.exe "$RUNNER_TEMP/smoke/"
      - name: No build-machine paths in the release binary
        run: |
          n=$(grep -a -c -i "runneradmin" src-tauri/target/release/yts-player.exe || true)
          echo "lines with the runner's user dir: $n"
          test "$n" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: ${{ runner.temp }}/smoke
          retention-days: 7

  smoke-windows:
    name: Smoke test Windows installer
    needs: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-windows
          path: smoke
      - name: Silent install (per user, no admin)
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke/*-setup.exe | Select-Object -First 1
          Write-Host "installer: $($installer.Name)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'YTS Player\yts-player.exe'
          if (-not (Test-Path $app)) { Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter yts-player.exe -ErrorAction SilentlyContinue | Select-Object FullName; throw "not installed at $app" }
          Get-ChildItem (Split-Path $app)
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk | Where-Object Name -like '*YTS*' | Select-Object FullName
          "E2E_APP_BINARY=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: choco install ffmpeg -y --no-progress
      - name: msedgedriver matching WebView2
        shell: pwsh
        run: |
          $exe = pwsh repo/e2e/scripts/get-msedgedriver.ps1 (Join-Path $env:RUNNER_TEMP edge) | Select-Object -Last 1
          "E2E_NATIVE_DRIVER=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
        working-directory: repo/e2e
      - name: E2E on the installed app (offline)
        working-directory: repo/e2e
        run: |
          export E2E_SEEDER_BINARY="$(cygpath -w "$GITHUB_WORKSPACE/smoke/e2e_seeder.exe")"
          export TAURI_DRIVER_BINARY="$(cygpath -w "$GITHUB_WORKSPACE/smoke/tauri-driver.exe")"
          npm run app
